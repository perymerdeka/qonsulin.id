name: qonsulin-dev

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: qonsulin-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.docker.local
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - WATCHPACK_POLLING=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
